<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <!-- Shelfie app icon: "night shelf" (option B) with three AI sparkles (as in D).
       Full-bleed square: iOS/Android round the corners themselves. -->
  <rect width="108" height="108" fill="#141a2e"/>
  <rect x="24" y="38" width="12" height="44" rx="3" fill="#5b7bff"/>
  <rect x="40" y="32" width="12" height="50" rx="3" fill="#8ea3ff"/>
  <rect x="56" y="40" width="12" height="42" rx="3" fill="#5b7bff"/>
  <!-- leaning book: rotated around its bottom-left corner so it never overlaps its neighbour -->
  <rect x="72" y="36" width="12" height="46" rx="3" fill="#a3b3ff" transform="rotate(14 72 82)"/>
  <rect x="18" y="84" width="72" height="4" rx="2" fill="#8ea3ff"/>
  <!-- big gold sparkle -->
  <path d="M46 10 C47.3 17 49.2 18.9 56 20.2 C49.2 21.5 47.3 23.4 46 30.4 C44.7 23.4 42.8 21.5 36 20.2 C42.8 18.9 44.7 17 46 10Z" fill="#ffd27a"/>
  <!-- medium white sparkle -->
  <path d="M66 14 C66.7 17.6 67.7 18.6 71.3 19.3 C67.7 20 66.7 21 66 24.6 C65.3 21 64.3 20 60.7 19.3 C64.3 18.6 65.3 17.6 66 14Z" fill="#ffffff"/>
  <!-- small blue sparkle -->
  <path d="M30 22 C30.45 24.3 31.1 24.95 33.4 25.4 C31.1 25.85 30.45 26.5 30 28.8 C29.55 26.5 28.9 25.85 26.6 25.4 C28.9 24.95 29.55 24.3 30 22Z" fill="#a3b3ff"/>
</svg>
