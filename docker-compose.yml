services:
  app:
    # Production pulls the published image. No build key here. Laptop builds add
    # docker-compose.dev.yml (`just docker`), which Compose does not load on its own.
    image: ghcr.io/gmiszcz/shelfie:${APP_TAG:-latest}
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
    volumes:
      - shelfie-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  shelfie-data:
