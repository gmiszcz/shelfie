name: CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          enable-cache: true
          version: 0.8.20

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run backend checks (ruff, mypy, bandit, pytest)
        run: just check-backend

  frontend:
    name: Frontend Typecheck, Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2.0.0

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend checks (tsc, vitest, vite build)
        run: just check-frontend

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Decide platforms and tags
        id: image
        run: |
          publish=false
          platforms=linux/amd64
          tags="ghcr.io/gmiszcz/shelfie:${GITHUB_SHA}"
          # PRs and main build multi-arch. Dev stays amd64-only so it does not
          # pay for QEMU. Only main is pushed.
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] || [ "$GITHUB_REF" = "refs/heads/main" ]; then
            platforms="linux/amd64,linux/arm64"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            publish=true
            tags="${tags},ghcr.io/gmiszcz/shelfie:latest"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ steps.image.outputs.platforms }}
          push: ${{ steps.image.outputs.publish == 'true' }}
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=shelfie

  deploy:
    name: Deploy to Fly.io
    # Only a push to main (a merge) deploys. It reuses the image the docker job just
    # built and pushed to GHCR (public package): Fly pulls it straight from ghcr.io.
    # Nothing is rebuilt. No copy to registry.fly.io: its login rejected the deploy
    # token with 401 (`flyctl auth docker`), and the copy is not needed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker]
    timeout-minutes: 15
    environment: production
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: mybooks
    steps:
      - name: Checkout code (for fly.toml)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # v1.6

      - name: Deploy the image
        run: flyctl deploy --app "${FLY_APP}" --image "ghcr.io/gmiszcz/shelfie:${GITHUB_SHA}" --ha=false --yes
